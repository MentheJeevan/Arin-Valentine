<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Arin ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #ff4d6d, #ff758c, #ff7eb3, #ffb3c6);
    background-size: 400% 400%;
    animation: gradient 8s ease infinite;
    overflow: hidden;
    color: white;
    text-align: center;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    font-size: 64px;
    margin-bottom: 10px;
    animation: fadeIn 1.5s ease forwards;
}

h2 {
    font-size: 34px;
    line-height: 1.4;
    max-width: 700px;
    animation: fadeIn 2.5s ease forwards;
}

.glow {
    text-shadow: 0 0 10px rgba(255,255,255,0.6),
                 0 0 20px rgba(255,255,255,0.4);
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,255,255,0.4); }
    to { text-shadow: 0 0 25px rgba(255,255,255,0.8); }
}

button {
    padding: 16px 40px;
    font-size: 20px;
    margin: 20px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
}

#yes {
    background: white;
    color: #ff4d6d;
}

#no {
    background: #111;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<h1>Hey Arin ❤️</h1>

<button id="yes" onclick="celebrate()">Yes</button>
<button id="no">No</button>

<script>
function celebrate() {
    document.body.innerHTML = `
    <h1 class="glow">Yayyy ❤️</h1>
    <h2>
    Fights happen. Love stays.<br><br>
    You’re the luckiest girl in this world —<br>
    because I’m still here, choosing us.<br><br>
    Let’s fix things and celebrate today 💫
    </h2>
    `;
}

// Moving NO button
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});
</script>

</body>
</html>
