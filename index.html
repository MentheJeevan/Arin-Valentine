<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Arin ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #ff4d6d, #ff758c, #ff7eb3, #ffb3c6);
    background-size: 400% 400%;
    animation: gradient 8s ease infinite;
    overflow: hidden;
    color: white;
    text-align: center;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    font-size: 36px;
}

button {
    padding: 15px 35px;
    font-size: 18px;
    margin: 15px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: white;
    color: #ff4d6d;
}

#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #222;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<h1>Hey Arin 💕<br>Will you be my Valentine?</h1>

<button id="yes" onclick="celebrate()">Yes ❤️</button>
<button id="no">No 🙈</button>

<script>
function celebrate() {
    document.body.innerHTML = `
    <h1 style="font-size:72px;">Yayyy ❤️</h1>
    <h2 style="font-size:38px; line-height:1.5;">
    Fights happen. Let’s fix things.<br>
    Love stays.<br><br>
    Let’s celebrate us today 💫
    </h2>
    `;
}

// Move NO button randomly when hovered
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});
</script>

</body>
</html>
